<!-- templates/auth/register.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione - Smart Parking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Registrazione</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                        
                        <form th:action="@{/register}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Nome Completo</label>
                                <input type="text" class="form-control" id="fullName" name="fullName" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="mb-3">
                                <label for="role" class="form-label">Ruolo</label>
                                <select class="form-select" id="role" name="role">
                                    <option value="BASE_USER">Utente Base</option>
                                    <option value="PREMIUM_USER">Utente Premium</option>
                                    <option value="ADMIN">Amministratore</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="carModel" class="form-label">Modello Auto</label>
                                <input type="text" class="form-control" id="carModel" name="carModel">
                            </div>
                            <div class="mb-3">
                                <label for="carLicensePlate" class="form-label">Targa Auto</label>
                                <input type="text" class="form-control" id="carLicensePlate" name="carLicensePlate">
                            </div>
                            <div class="mb-3">
                                <label for="batteryCapacityKw" class="form-label">Capacità Batteria (kW)</label>
                                <input type="number" class="form-control" id="batteryCapacityKw" name="batteryCapacityKw">
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Registrati</button>
                            </div>
                        </form>
                        
                        <div class="mt-3 text-center">
                            <p>Hai già un account? <a th:href="@{/login}">Login</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
